name: Build FactionDominion

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FactionDominion-jar
          path: target/*.jar
